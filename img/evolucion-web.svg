  <circle cx="840" cy="190" r="16" fill="#f4a259" stroke="#ffffff" stroke-width="4"/>
  <text x="840" y="240" text-anchor="middle" font-size="24" font-weight="700" fill="#0b2545">Hoy</text>
  <text x="840" y="268" text-anchor="middle" font-size="19" font-weight="600" fill="#1b998b">Web de servicios</text>
  <text x="840" y="294" text-anchor="middle" font-size="16" fill="#4a5a6a">Aulas, trámites y</text>
  <text x="840" y="314" text-anchor="middle" font-size="16" fill="#4a5a6a">compras en línea</text>
